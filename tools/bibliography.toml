# Pinned bibliography for tools/release_checks.py's citation-check.
#
# Every entry below is transcribed (not invented) from one of:
#   - paper/refs.bib
#   - src/cliffordclock/ensemble/species.py (docstrings/comments)
#   - benchmarks/RESULTS.md, benchmarks/SOURCES.md, benchmarks/MAPPING.md
#   - benchmarks/results/*.md
#
# Fields:
#   key      -- a short identifier (matches paper/refs.bib's key where one exists)
#   authors  -- the author byline as it appears in the source, verbatim where the
#               source gave a full list; some source citations are themselves
#               abbreviated ("et al.", "and coauthors", "Barrett group") -- that
#               abbreviation is preserved here rather than expanded/invented.
#   surnames -- surnames extracted from `authors`, used by citation-check's grep
#               (a surname + a nearby year that does not match one of `year`'s
#               values is flagged as contradicting this pinned record).
#   title    -- paper title, transcribed where the source states one; empty
#               string if no title is given in the citing source (never invented).
#   venue    -- journal/venue string as given in the source.
#   year     -- publication year(s) actually cited for this work.
#   arxiv    -- arXiv identifier, if cited.
#   doi      -- DOI, if cited.
#   source   -- where this entry was transcribed from (file[:line]).

