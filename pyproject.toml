[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cliffordclock"
version = "0.1.0.post1"
description = "Optical-atomic-clock fractional frequency shift calculations via Spacetime Algebra Cl(1,3) rotor dynamics"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "CliffordClock contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "jax",
    "numpy",
    "scipy",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "clifford",
    "ruff",
    "mypy",
    "pre-commit",
]
notebooks = [
    "matplotlib",
    "jupyter",
    "nbconvert",
]

[project.scripts]
cliffordclock = "cliffordclock.cli:main"

[project.urls]
Homepage = "https://github.com/velar-mbr/CliffordClock"
Documentation = "https://github.com/velar-mbr/CliffordClock/blob/main/docs/index.md"
Changelog = "https://github.com/velar-mbr/CliffordClock/blob/main/CHANGELOG.md"
Paper = "https://github.com/velar-mbr/CliffordClock/blob/main/paper/main.pdf"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
# 3.12, not the 3.11 floor: numpy >= 2.3 ships PEP 695 `type`-statement
# stubs that mypy only parses under a 3.12+ target, and CI type-checks on
# 3.12. Runtime support for 3.11 is unchanged (requires-python above).
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true
disable_error_code = ["no-untyped-def"]

[[tool.mypy.overrides]]
module = "clifford.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "slow: JAX compile-heavy or long-running tests, split into a separate CI job (deselect with -m \"not slow\")",
]

[tool.coverage.run]
source = ["src"]
