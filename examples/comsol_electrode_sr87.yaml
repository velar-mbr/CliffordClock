# CliffordClock example: `field.comsol` config wiring -- a COMSOL
# "Spreadsheet"-format E-field export loaded directly through
# `config.yaml` (no Python-API detour), Sr-87 optical-lattice (Hermite-
# Gauss motional-quadrature) ensemble, PHYSICAL DC-Stark coupling
# (CONVENTIONS.md E14b). See docs/cli.md's "Field sources" section for the
# full schema and docs/fields.md / docs/byof-guide.md for the COMSOL
# export-format contract.
#
# The field is `examples/fd_electrode_field.txt`
# (`examples/generate_fd_electrode_field.py`): a from-scratch
# finite-difference solve of a grounded box with two +/-2 V electrode
# plates, 3.2 mm apart, written out in COMSOL's native Spreadsheet format
# and loaded back here exactly the way a lab's own COMSOL export would be
# (docs/byof-guide.md's "COMSOL exports" section). `expression_prefix` is
# omitted below -- the generator writes the default `es.Ex`/`es.Ey`/`es.Ez`
# columns (COMSOL's built-in Electrostatics interface), so the loader's
# own default ("es") already matches; pass `expression_prefix: <tag>` here
# if your own model renamed the interface.
#
# Trap placement: `trap.center` below is the exported sub-cube's own
# domain center (5.0 mm, 5.0 mm, 4.0 mm) -- equidistant between the two
# plates in z, centered in x/y, the same point
# `generate_fd_electrode_field.py`'s own back-of-envelope check uses. This
# keeps every lattice quadrature node deep inside the exported grid's
# interior (docs/byof-guide.md's "Grid spacing vs. feature size":
# `OutOfBoundsWarning` triggers on extrapolation past the fit's bounding
# box), never near an unfitted edge.
#
# Back-of-envelope expected shift (computed here, not tuned to match):
# the finite-difference solve reports E_z(domain center) = 1243.7652 V/m
# (module docstring of generate_fd_electrode_field.py: "-0.5% off the
# 1250.0 V/m ideal parallel-plate estimate"). Sr-87's registry
# differential polarizability (T. Middelmann et al., PRL 109, 263004
# (2012)) gives, via CONVENTIONS.md E14b's k_S = -Delta_alpha / (2h):
#
#   Delta_alpha    = 4.07873e-39  C^2 m^2 J^-1  (species registry)
#   h              = 6.62607015e-34 J.s
#   k_S            = -Delta_alpha / (2h) = -3.077790e-06 Hz.m^2.V^-2
#   nu_0 (Sr87)    = 429228004229873.4 Hz
#   |E(center)|^2  = 1243.7652^2 = 1.546952e+06 V^2/m^2
#
#   Delta_nu/nu_0  = k_S * |E|^2 / nu_0
#                  = (-3.077790e-06 * 1.546952e+06) / 429228004229873.4
#                  ~= -1.109e-14
#
# A pipeline run at this trap.center should land within a few percent of
# -1.109e-14 (tests/test_e2e.py checks this against a documented band,
# accounting for FieldSmoother's RBF fit sitting exactly on the FD grid's
# own -0.5%-off-ideal value, not the idealized parallel-plate number).
#
# T=1s genuine interrogation via the E29 lattice fast path (Tier A):
# static motional-state quadrature nodes need no time integration at all,
# so this costs the same wall time as any other T (see docs/timescales.md).
# The RBF fit over the exported grid's 3375 points plus the fast-path
# evaluation both complete in well under a minute on CPU.

species: Sr87

trap:
  omega_xyz: [2.0e+5, 2.0e+5, 2.0e+5]        # rad/s, typical lattice-site scale
  center: [5.0e-3, 5.0e-3, 4.0e-3]           # m -- the exported field's own domain center

field:
  comsol: examples/fd_electrode_field.txt    # COMSOL "Spreadsheet"-format export
                                              # (docs/fields.md, docs/byof-guide.md);
                                              # generated by examples/generate_fd_electrode_field.py
  # expression_prefix: es                    # optional (default "es"); shown here for
                                              # documentation -- omit unless your COMSOL
                                              # model renamed the Electrostatics interface
  smoothing: 0.0                             # exact interpolation: the FD solve is
                                              # noiseless (docs/byof-guide.md's smoothing
                                              # guidance covers noisy real data)

coupling:
  type: stark_dc  # E14b; no override fields given -> resolved from the
                  # Sr87 species-registry entry's cited Delta_alpha.

ensemble:
  regime: lattice
  temperature_uK: 1.0
  motional_n: [0, 0, 0]
  n_quad: 8  # default Gauss-Hermite resolution -- the fitted field is not
             # exactly uniform across the lattice site (unlike
             # examples/lattice_sr87_stark.yaml's synthetic uniform field),
             # so the ensemble's phase spread (T2*) is genuinely nonzero,
             # if extremely small at this field's mm-scale smoothness
             # against the lattice site's nanometer-scale motional extent.

integration:
  time_s: 1.0  # genuine 1-second interrogation (E29 fast path, no time
               # stepping -- integration.mode defaults to "fast_path" for
               # ensemble.regime: lattice).

output:
  directory: .
  report_filename: report.json
  line_profile_filename: line_profile.csv
  n_time_samples: 512

uncertainty_notes: >-
  field.comsol config-wiring demo (docs/cli.md, docs/fields.md,
  docs/byof-guide.md): physical E14b DC-Stark coupling, Sr87 registry
  Delta_alpha, field loaded from examples/fd_electrode_field.txt (a
  from-scratch finite-difference two-electrode-capacitor solve, see
  examples/generate_fd_electrode_field.py) via the COMSOL Spreadsheet-
  format loader and FieldSmoother -- not a measured or COMSOL-produced
  field. No experimental-dataset comparison, no BBR modeling, no
  systematic-uncertainty budget beyond what coupling/fast_path provenance
  notes state.
