# CliffordClock example: the "bring your own field" worked example --
# a physically-shaped stray-field scenario through the FULL pipeline, at a
# real interrogation time, with the physical coupling.
#
# Unlike every other shipped example, this one's field is NOT a closed-form
# synthetic factory (`field.synthetic`): it is a CSV field grid
# (`examples/patch_field_sr87.csv`, generated by
# `examples/generate_patch_field.py`, see that script's module docstring
# for the full physics and back-of-envelope derivation), loaded and fit
# with `cliffordclock.fields.FieldSmoother` exactly the way a lab's own
# COMSOL/FEA export would be -- this is the config a postdoc adapts by
# swapping the `field.csv` path for their own export (docs/byof-guide.md).
#
# Scenario: a small uniform residual bias field plus six Gaussian
# patch-potential contributions (0.5-5 V, Lodewyck-bracketed partially-
# discharged trapped charge -- Lodewyck et al., IEEE Trans. UFFC 59, 411
# (2012)) on in-vacuum dielectric surfaces (mirror/viewport faces) ~25 mm
# from an Sr-87 optical-lattice trap. `coupling.type: stark_dc` (E14b, the
# physical DC-Stark coupling, docs/coupling.md) resolves Sr-87's literature
# Delta_alpha from the species registry -- see docs/coupling.md and
# docs/CONVENTIONS.md.
#
# T=1s genuine interrogation via the E29 lattice fast path (Tier A):
# static motional-state quadrature nodes need no time integration at all
# (docs/timescales.md), so this costs the same wall time as any other T.
#
# CAVEAT (E29 scope, CONVENTIONS.md section 12): the fast
# path reports the Stark/field shift ONLY -- it omits the motional
# second-order Doppler shift a lattice state's velocity spread would carry
# (a real, separately-budgeted systematic; E29 does not compute it, by
# construction -- see the `uncertainty_notes` this run's report records,
# and docs/byof-guide.md / notebooks/04_bring_your_own_field.ipynb for the
# same caveat repeated where the numbers are interpreted).

species: Sr87

trap:
  omega_xyz: [2.0e+5, 2.0e+5, 2.0e+5]  # rad/s, typical lattice-site scale
  center: [0.0, 0.0, 0.0]              # m

field:
  csv: examples/patch_field_sr87.csv   # docs/fields.md CSV contract; see
                                        # examples/generate_patch_field.py
  smoothing: 0.0                       # exact interpolation: the generated
                                        # grid is noiseless (see
                                        # docs/byof-guide.md for smoothing
                                        # > 0 guidance on real, noisy data)

coupling:
  type: stark_dc  # E14b; no override fields given -> resolved from the
                  # Sr87 species-registry entry's cited Delta_alpha.

ensemble:
  regime: lattice
  temperature_uK: 1.0
  motional_n: [0, 0, 0]
  n_quad: 8  # default Gauss-Hermite resolution: this field is NOT
             # spatially uniform (unlike examples/lattice_sr87_stark.yaml),
             # so the ensemble's phase spread -- and hence T2* -- is
             # genuinely nonzero here.

integration:
  time_s: 1.0  # genuine 1-second interrogation (E29 fast path, no time
               # stepping -- integration.mode defaults to "fast_path" for
               # ensemble.regime: lattice).

output:
  directory: .
  report_filename: report.json
  line_profile_filename: line_profile.csv
  n_time_samples: 512

uncertainty_notes: >-
  Realistic worked example (docs/byof-guide.md): physical E14b DC-Stark coupling, Sr87
  registry Delta_alpha, field imported from a generated (not synthetic-
  factory) CSV grid via FieldSmoother -- see
  examples/generate_patch_field.py for the scenario's physics and
  docs/byof-guide.md for the adaptation guide. No experimental-dataset
  comparison, no BBR modeling, no systematic-uncertainty
  budget beyond what coupling/fast_path provenance notes state.
