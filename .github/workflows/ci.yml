name: CI

# Cost policy (owner directive, 2026-08-11): CI on GitHub-hosted runners
# is kept minimal because everything here is runnable locally. The pytest
# suite is dominated by a handful of JAX compile-heavy integration tests
# (marked `slow`, registered in pyproject.toml), so the suite runs as two
# parallel jobs instead of one long serial one: `test` (lint, format,
# mypy, and every test except `slow`) and `test-slow` (`slow` tests only).
# A third job combines their coverage data so the 90% gate still applies
# to the whole suite rather than to either half alone. The
# notebook-execution job remains MANUAL ONLY (workflow_dispatch) because
# the showcase notebook's Monte Carlo run is heavy enough to run for
# hours on a 2-core hosted runner.

# Superseded runs on the same branch/PR are cancelled automatically so
# rapid pushes never stack up runner time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_notebooks:
        description: "Also execute all notebooks (slow)"
        type: boolean
        default: false

jobs:
  test:
    name: Test (fast)
    runs-on: ubuntu-latest
    # 25, not 15: the not-slow set measured 15m15s+ on the 2-core runner
    # (the local profiling that suggested under 10 minutes does not
    # transfer 1:1); 25 leaves headroom without masking a hang.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy src/

      - name: Test (pytest, excluding slow)
        run: pytest -m "not slow" --cov
        env:
          COVERAGE_FILE: .coverage.fast

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fast
          path: .coverage.fast
          retention-days: 1
          if-no-files-found: error
          # upload-artifact@v4 excludes dotfiles by default; the coverage
          # data file is one.
          include-hidden-files: true

  test-slow:
    name: Test (slow)
    runs-on: ubuntu-latest
    # 90, not 60: the slow set is the dominant share of a suite whose
    # single-job run exceeded a 60-minute cap on this 2-core runner
    # (measured 2026-08-22); 90 gives measured headroom without letting
    # a genuine hang run unbounded.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Test (pytest, slow only)
        run: pytest -m slow --cov
        env:
          COVERAGE_FILE: .coverage.slow

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-slow
          path: .coverage.slow
          retention-days: 1
          if-no-files-found: error
          # upload-artifact@v4 excludes dotfiles by default; the coverage
          # data file is one.
          include-hidden-files: true

  coverage:
    name: Combined coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, test-slow]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage
        run: pip install "coverage[toml]"

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine and enforce 90% coverage
        run: |
          coverage combine .coverage.fast .coverage.slow
          coverage report --fail-under=90

  notebooks:
    # Manual only: run from the Actions tab when a notebook-affecting
    # change lands. Never triggered by push/PR.
    if: github.event_name == 'workflow_dispatch' && inputs.run_notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with dev + notebooks dependencies
        run: pip install -e ".[dev,notebooks]"

      - name: Execute notebooks
        run: |
          for nb in notebooks/*.ipynb; do
            echo "== $nb =="
            jupyter nbconvert --to notebook --execute \
              --output "/tmp/$(basename "$nb" .ipynb).executed.ipynb" "$nb"
          done
