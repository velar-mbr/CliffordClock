name: CI

# Cost policy (owner directive, 2026-08-11): CI on GitHub-hosted runners
# is kept minimal because everything here is runnable locally. The pytest
# suite is dominated by a handful of JAX compile-heavy integration tests
# (marked `slow`, registered in pyproject.toml), so the suite runs as two
# parallel jobs instead of one long serial one: `test` (lint, format,
# mypy, and every test except `slow`) and `test-slow` (`slow` tests only).
# A third job combines their coverage data so the 90% gate still applies
# to the whole suite rather than to either half alone. The
# notebook-execution job remains MANUAL ONLY (workflow_dispatch) because
# the showcase notebook's Monte Carlo run is heavy enough to run for
# hours on a 2-core hosted runner.

# Superseded runs on the same branch/PR are cancelled automatically so
# rapid pushes never stack up runner time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_notebooks:
        description: "Also execute all notebooks (slow)"
        type: boolean
        default: false

jobs:
  checks:
    name: Lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy src/

  test:
    name: Test (fast, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Sharded three ways, size-balanced, each printing --durations=25.
    # Runner profiling (2026-08-22) showed the fast set is minutes per
    # shard once the two pathological generators (the patch-field and FD
    # electrode regeneration tests, 29 and 11 runner-minutes) moved to
    # the slow lane where they belong.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Test (pytest, excluding slow, this shard's files)
        run: |
          # Round-robin over files sorted by size (a cheap runtime proxy):
          # the heavy JAX test files cluster alphabetically, so a plain
          # alphabetical interleave once landed nearly all of them in one
          # shard, which then timed out. Size-descending round-robin
          # spreads them and still gives any new file a shard.
          FILES=$(wc -c tests/test_*.py | grep -v " total$" | sort -rn | awk '{print $2}' | awk "NR % 3 == ${{ matrix.shard }}")
          echo "shard ${{ matrix.shard }} files:"; echo "$FILES"
          pytest $FILES -m "not slow" --cov --durations=25
        env:
          COVERAGE_FILE: .coverage.fast${{ matrix.shard }}

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fast-${{ matrix.shard }}
          path: .coverage.fast${{ matrix.shard }}
          retention-days: 1
          if-no-files-found: error
          # upload-artifact@v4 excludes dotfiles by default; the coverage
          # data file is one.
          include-hidden-files: true

  test-slow:
    name: Test (slow, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Sharded three ways by the same size-descending file round-robin the
    # fast lane uses, plus one measured exception. A single-job slow lane
    # took 65 minutes on this 2-core runner on a good day and 88 minutes
    # on a slow one (2026-09-05) against a 90-minute cap: no margin. The
    # first sharded run (2026-09-05) measured 45 / 26 / 2 minutes: the
    # round-robin put the two largest slow files, test_lattice_light_shift_jax
    # (about 27 runner-minutes) and test_lattice_extended (about 10), in
    # the same shard while the third shard ran two tests. The extended
    # lattice file is therefore pinned to shard 2 after the round-robin,
    # which leaves every other file's shard unchanged and projects to
    # roughly 35 / 26 / 12. The 90-minute cap stays as a genuine
    # hang-guard per shard. --durations=25 records what dominates, which
    # the single-job lane never did.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Test (pytest, slow only, this shard's files)
        run: |
          FILES=$(wc -c tests/test_*.py | grep -v " total$" | sort -rn | awk '{print $2}' | awk "NR % 3 == ${{ matrix.shard }}" | grep -v "tests/test_lattice_extended.py")
          if [ "${{ matrix.shard }}" = "2" ]; then FILES="$FILES tests/test_lattice_extended.py"; fi
          echo "shard ${{ matrix.shard }} files:"; echo "$FILES"
          pytest $FILES -m slow --cov --durations=25
        env:
          COVERAGE_FILE: .coverage.slow${{ matrix.shard }}

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-slow-${{ matrix.shard }}
          path: .coverage.slow${{ matrix.shard }}
          retention-days: 1
          if-no-files-found: error
          # upload-artifact@v4 excludes dotfiles by default; the coverage
          # data file is one.
          include-hidden-files: true

  test-slow-gate:
    # The branch ruleset requires a status check named "Test (slow)", the
    # single-job lane's name. The sharded matrix reports per shard, so this
    # job carries the required name and passes only when every shard did.
    # `if: always()` makes a shard failure report here as a failure; a
    # skipped required check can read as satisfied.
    name: Test (slow)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test-slow
    if: always()
    steps:
      - name: Require every slow shard to pass
        run: |
          echo "slow shards result: ${{ needs.test-slow.result }}"
          [ "${{ needs.test-slow.result }}" = "success" ]

  coverage:
    name: Combined coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, test-slow]
    # (both matrices gate on all three of their shards)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage
        run: pip install "coverage[toml]"

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine and enforce 90% coverage
        run: |
          coverage combine
          coverage report --fail-under=90

  notebooks:
    # Manual only: run from the Actions tab when a notebook-affecting
    # change lands. Never triggered by push/PR.
    if: github.event_name == 'workflow_dispatch' && inputs.run_notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with dev + notebooks dependencies
        run: pip install -e ".[dev,notebooks]"

      - name: Execute notebooks
        run: |
          for nb in notebooks/*.ipynb; do
            echo "== $nb =="
            jupyter nbconvert --to notebook --execute \
              --output "/tmp/$(basename "$nb" .ipynb).executed.ipynb" "$nb"
          done
