name: CI

# Cost policy (owner directive, 2026-08-11): CI on GitHub-hosted runners
# is kept minimal because everything here is runnable locally. One fast
# job on push/PR with a hard timeout; the notebook-execution job is
# MANUAL ONLY (workflow_dispatch) because the showcase notebook's Monte
# Carlo run is heavy enough to run for hours on a 2-core hosted runner.

# Superseded runs on the same branch/PR are cancelled automatically so
# rapid pushes never stack up runner time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_notebooks:
        description: "Also execute all notebooks (slow)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    # Measured 2026-08-22: the full suite EXCEEDS 60 minutes on a 2-core
    # hosted runner (the JAX compile-heavy lattice_extended/worldline
    # tests that take minutes on a developer machine dominate), and no
    # run of it has ever completed here. Until the fast/slow lane split
    # lands (in progress), this job cannot go green on a full-suite run;
    # the repo's operative gate is the local pre-PR battery.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy src/

      - name: Test (pytest)
        run: pytest --cov --cov-fail-under=90

  notebooks:
    # Manual only: run from the Actions tab when a notebook-affecting
    # change lands. Never triggered by push/PR.
    if: github.event_name == 'workflow_dispatch' && inputs.run_notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with dev + notebooks dependencies
        run: pip install -e ".[dev,notebooks]"

      - name: Execute notebooks
        run: |
          for nb in notebooks/*.ipynb; do
            echo "== $nb =="
            jupyter nbconvert --to notebook --execute \
              --output "/tmp/$(basename "$nb" .ipynb).executed.ipynb" "$nb"
          done
